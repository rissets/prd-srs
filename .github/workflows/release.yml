name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_skill.py .
      - run: python tests/check_library_package.py examples/library
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Verify tag and build ZIP
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          mkdir -p dist
          git archive --format=zip --prefix=prd-srs/ --output="dist/prd-srs-${RELEASE_TAG}.zip" HEAD
          cd dist
          sha256sum "prd-srs-${RELEASE_TAG}.zip" > "prd-srs-${RELEASE_TAG}.zip.sha256"
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --prerelease --title "$RELEASE_TAG" --notes-file CHANGELOG.md
          fi
          gh release upload "$RELEASE_TAG" "dist/prd-srs-${RELEASE_TAG}.zip" "dist/prd-srs-${RELEASE_TAG}.zip.sha256" --clobber
